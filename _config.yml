# Informazioni del sito
title: "Ombre e Percorsi"
description: "Tracce di luoghi, storie e persone"
baseurl: ""  # ← CAMBIATO: vuoto per dominio personalizzato
url: "https://ombrepercorsi.com"  # ← CAMBIATO: il tuo nuovo dominio

# Autore
author:
  name: "Pietro"
  email: "pbarale00@gmail.com"
  bio: "Racconto luoghi, storie e incontri attraverso parole e immagini."

# Social media
social:
  github: "pietro00b"
  email: "pbarale00@gmail.com"

# Build settings
markdown: kramdown
highlighter: rouge
timezone: Europe/Rome
lang: it

# Plugin (solo quelli supportati da GitHub Pages)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collection degli album fotografici
collections:
  albums:
    output: true
    permalink: /album/:path/

# Menu di navigazione
navigation:
  - title: "Home"
    url: "/"
  - title: "Chi sono"
    url: "/about/"

# Esclusioni
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - node_modules/
  - "*.gem"
  - "*.gemspec"

# Inclusioni per le pagine in cartella pages
include:
  - pages

# Configurazioni Jekyll per GitHub Pages
safe: true
incremental: false

# Sass
sass:
  sass_dir: _sass
  style: compressed

# SEO e defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "albums"
    values:
      layout: "album"
